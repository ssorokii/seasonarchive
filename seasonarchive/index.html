<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>seasonarchive</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <button class="admin-toggle" id="admin-toggle-btn" onclick="toggleAdmin()">🔒 admin</button>

  <!-- Header -->
  <div class="container" style="padding-top: 48px; padding-bottom: 24px;">
    <div style="margin-bottom: 8px; font-size: 12px; letter-spacing: 4px; color: rgba(0,0,0,0.4); font-family: 'Playfair Display', serif;">seasonarchive</div>
    <div class="header-title" id="header-title">Season Archive</div>
    <div id="season-desc" style="margin-top: 10px; font-size: 14px; color: rgba(0,0,0,0.45); font-family: 'Noto Serif KR', serif;"></div>
  </div>

  <!-- Season Tabs -->
  <div class="container" style="padding-bottom: 36px;">
    <div style="display: flex; gap: 10px; flex-wrap: wrap;" id="season-tabs"></div>
  </div>

  <!-- Category Tabs + Works -->
  <div class="container" style="padding-bottom: 80px;">
    <div id="cat-tabs-container"></div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px;">
      <span class="count-badge" id="count-badge"></span>
      <div class="divider"></div>
    </div>
    <div id="works-list"></div>
  </div>

  <!-- 로그인 모달 -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-modal">
      <div style="font-family: 'Playfair Display', serif; font-size: 18px; font-style: italic; color: #3a2a3a;">🔒 admin login</div>
      <div style="font-size: 12px; color: #aaa; margin-top: 6px; font-family: 'Noto Serif KR', serif;">비밀번호를 입력하세요</div>
      <input type="password" id="pw-input" placeholder="••••••••" />
      <div class="login-error" id="login-error"></div>
      <button class="login-submit" onclick="checkPassword()">로그인</button>
    </div>
  </div>

  <!-- 작품 추가 모달 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div style="font-family: 'Playfair Display', serif; font-size: 20px; font-style: italic; margin-bottom: 20px;" id="modal-title"></div>
      <label class="field-label">Poster Image URL <span style="font-size:11px; color:#bbb;">(선택)</span></label>
      <input type="text" id="input-poster" placeholder="포스터 이미지 주소 붙여넣기" />
      <div id="add-poster-preview" style="margin-top:8px; display:none;">
        <div style="width:72px; aspect-ratio:2/3; border-radius:10px; overflow:hidden; background:#f0f0f0;">
          <img id="add-poster-img" src="" style="width:100%; height:100%; object-fit:cover;" />
        </div>
      </div>
      <label class="field-label">Title</label>
      <input type="text" id="input-title" placeholder="작품 제목" />
      <label class="field-label" id="year-label">Released</label>
      <input type="text" id="input-year" placeholder="예: 2024" />
      <label class="field-label">Mood <span style="font-size:11px; color:#bbb;">(여러 개 선택 가능)</span></label>
      <div class="mood-chips" id="add-mood-chips"></div>
      <button class="mood-manage-btn" onclick="toggleMoodManage('add')">+ 무드 편집</button>
      <div class="mood-manage-area" id="add-mood-manage">
        <div class="mood-manage-list" id="add-mood-manage-list"></div>
        <div class="mood-add-row">
          <input class="mood-add-input" id="add-mood-input" placeholder="새 무드 추가..." onkeydown="if(event.key==='Enter') addMood('add')" />
          <button class="mood-add-btn" onclick="addMood('add')">추가</button>
        </div>
      </div>
      <label class="field-label">Note (optional)</label>
      <textarea id="input-note" placeholder="이 작품을 추천하는 이유..."></textarea>
      <button class="submit-btn" id="submit-btn" onclick="handleAdd()">추가하기</button>
    </div>
  </div>

  <!-- 작품 수정 모달 -->
  <div class="modal-overlay" id="edit-modal-overlay">
    <div class="modal">
      <div style="font-family: 'Playfair Display', serif; font-size: 20px; font-style: italic; margin-bottom: 20px;" id="edit-modal-title"></div>
      <label class="field-label">Poster Image URL <span style="font-size:11px; color:#bbb;">(선택)</span></label>
      <input type="text" id="edit-input-poster" placeholder="포스터 이미지 주소 붙여넣기" />
      <div id="edit-poster-preview" style="margin-top:8px; display:none;">
        <div style="width:72px; aspect-ratio:2/3; border-radius:10px; overflow:hidden; background:#f0f0f0;">
          <img id="edit-poster-img" src="" style="width:100%; height:100%; object-fit:cover;" />
        </div>
      </div>
      <label class="field-label">Title</label>
      <input type="text" id="edit-input-title" placeholder="작품 제목" />
      <label class="field-label" id="edit-year-label">Released</label>
      <input type="text" id="edit-input-year" placeholder="예: 2024" />
      <label class="field-label">Mood <span style="font-size:11px; color:#bbb;">(여러 개 선택 가능)</span></label>
      <div class="mood-chips" id="edit-mood-chips"></div>
      <button class="mood-manage-btn" onclick="toggleMoodManage('edit')">+ 무드 편집</button>
      <div class="mood-manage-area" id="edit-mood-manage">
        <div class="mood-manage-list" id="edit-mood-manage-list"></div>
        <div class="mood-add-row">
          <input class="mood-add-input" id="edit-mood-input" placeholder="새 무드 추가..." onkeydown="if(event.key==='Enter') addMood('edit')" />
          <button class="mood-add-btn" onclick="addMood('edit')">추가</button>
        </div>
      </div>
      <label class="field-label">Note (optional)</label>
      <textarea id="edit-input-note" placeholder="이 작품을 추천하는 이유..."></textarea>
      <button class="submit-btn" id="edit-submit-btn" onclick="handleEdit()">수정하기</button>
    </div>
  </div>

  <!-- JS 로드 순서 중요: data → mood → render → admin → main -->
  <script src="js/data.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/render.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
